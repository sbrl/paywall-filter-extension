<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    width: 260px;
    padding: 14px;
    color: #222;
  }
  h1 { font-size: 14px; margin: 0 0 6px; }
  p { font-size: 12.5px; color: #666; margin: 0 0 10px; }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #2c7be5;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
    font-size: 13px;
  }
  button.secondary {
    background: #eee;
    color: #333;
  }
  #status { font-size: 12px; color: #444; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Paywall Filter</h1>
  <p id="count">Loading…</p>
  <button id="addCurrent" style="display:none"></button>
  <button id="openOptions" class="secondary">Manage subscriptions</button>
  <div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
